<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrology Request Tracker</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Gate: shown until the data folder is connected and we know who you are -->
<div id="gate" class="gate" hidden>
  <main class="gate-card" id="gateCard" aria-live="polite"></main>
</div>

<!-- Application shell -->
<div id="shell" class="shell" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name">Metrology Request Tracker</span>
      <span class="brand-ver" id="brandVer"></span>
    </div>
    <button class="save-led" id="saveLed" type="button" data-action="save-state"
            aria-live="polite"></button>
    <button class="undo-btn" id="undoBtn" type="button" data-action="undo" hidden></button>

    <div class="search">
      <span class="search-icon" id="searchIcon"></span>
      <input id="search" type="search" placeholder="Search tools, people, BKMs&hellip;"
             aria-label="Search" autocomplete="off">
      <kbd class="search-kbd">/</kbd>
    </div>

    <div class="topbar-right">
      <button class="btn-icon bell-btn" id="bellBtn" type="button" data-action="bell" aria-haspopup="menu" aria-expanded="false"
              title="Notifications" aria-label="Notifications"><span class="bell-icon" id="bellIcon"></span><span class="bell-count" id="bellCount" hidden></span></button>
      <a class="btn-icon" id="helpBtn" href="#/help" title="Help (g h)" aria-label="Help"></a>
      <button class="btn-icon" id="keysBtn" type="button" data-action="show-keys"
              title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      <button class="user-btn" id="userBtn" type="button" data-action="user-menu" aria-haspopup="menu"
              aria-expanded="false" aria-label="User menu">
        <span class="user-avatar" id="userAvatar"></span>
        <span class="user-name" id="userName"></span>
        <span class="user-caret" id="userCaret"></span>
      </button>
    </div>
  </header>

  <!-- Alert strip, on every page. A stub in M1: from M3 it shows the queue
       counts (Line stop, late, on hold), like ABF's status strip (M1-2). -->
  <div id="alertBanner" class="alert-banner" role="status" hidden></div>
  <div id="conflictBanner" class="conflict-banner" role="alert" hidden></div>

  <div class="body">
    <!-- Filled from the NAV list in js/app.js: live pages link, later ones are greyed (M1-6) -->
    <nav class="nav" id="nav" aria-label="Main">
      <div class="nav-items" id="navItems"></div>
      <div class="nav-foot">
        <div class="nav-folder" id="navFolder"></div>
        <div class="nav-rev" id="navRev"></div>
      </div>
      <button class="nav-collapse" id="navCollapse" type="button" data-action="nav-collapse" aria-controls="nav"></button>
    </nav>

    <main class="main" id="main" tabindex="-1" aria-label="Main content"></main>
  </div>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="dialogHost"></div>

<!-- Classic scripts, in dependency order. No modules: they do not load from file:// -->
<script src="js/config.js"></script>
<script src="js/domain.js"></script>
<script src="js/adapters/storage-folder.js"></script>
<script src="js/adapters/mail.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/demo-data.js"></script>  <!-- made-up demo data, only built when an admin asks (Settings > Data) -->
<script src="js/identity.js"></script>
<script src="js/analytics.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>  <!-- optional: exports fall back to CSV without it -->  <!-- optional: charts show a notice without it -->
<script src="js/ui/core.js"></script>
<script src="js/ui/components.js"></script>
<script src="js/ui/glyphs.js"></script>
<script src="js/ui/heatmap.js"></script>
<script src="js/ui/overlays.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/panelmap.js"></script>
<script src="js/ui/barcode.js"></script>
<script src="js/ui/magazine.js"></script>
<script src="js/ui/traveller.js"></script>
<script src="js/ui/hirata.js"></script>
<script src="js/exporter.js"></script>
<script src="js/views/lab.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/settings-health.js"></script>
<script src="js/views/settings-users.js"></script>
<script src="js/views/settings-tools.js"></script>
<script src="js/views/settings-lists.js"></script>
<script src="js/views/settings-lots.js"></script>
<script src="js/views/settings-calendar.js"></script>
<script src="js/views/settings-audit.js"></script>
<script src="js/views/settings-data.js"></script>
<script src="js/views/extra-fields.js"></script>
<script src="js/views/lots.js"></script>
<script src="js/views/new.js"></script>
<script src="js/views/request-actions.js"></script>
<script src="js/views/request.js"></script>
<script src="js/views/queue.js"></script>
<script src="js/views/requests.js"></script>
<script src="js/views/board.js"></script>
<script src="js/views/slip.js"></script>
<script src="js/views/hirata.js"></script>
<script src="js/views/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
